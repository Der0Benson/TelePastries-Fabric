name: Fehlerbericht
description: Einen reproduzierbaren Fehler oder Absturz melden
title: "[Fehler]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Danke für deinen Fehlerbericht. Dieses Repository behandelt ausschließlich die Fabric-Portierung für Minecraft 1.21.1.

  - type: checkboxes
    id: checks
    attributes:
      label: Vorprüfung
      options:
        - label: Ich verwende Minecraft 1.21.1 mit Fabric, nicht Minecraft 1.21.11 oder NeoForge.
          required: true
        - label: Ich habe ältere TelePastries-JARs aus dem Mods-Ordner entfernt.
          required: true
        - label: Ich habe nach einem bereits gemeldeten Fehler gesucht.
          required: true

  - type: input
    id: loader
    attributes:
      label: Fabric-Loader-Version
      placeholder: Zum Beispiel 0.19.5
    validations:
      required: true

  - type: input
    id: mod
    attributes:
      label: TelePastries-Version
      placeholder: Zum Beispiel 0.11.2-fabric.5
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Fehlerbeschreibung
      description: Was ist passiert, was wurde erwartet und wie lässt sich der Fehler reproduzieren?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Protokoll oder Absturzbericht
      description: Bitte die vollständige Datei `latest.log` oder den vollständigen Absturzbericht anhängen.
    validations:
      required: true
