name: Verbesserungsvorschlag
description: Eine Änderung oder Ergänzung für die Fabric-Portierung vorschlagen
title: "[Vorschlag]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Danke für deinen Vorschlag. Änderungen sollten zum Umfang und Spielgefühl des Originalprojekts passen.

  - type: textarea
    id: motivation
    attributes:
      label: Ausgangslage
      description: Welches Problem oder welcher fehlende Anwendungsfall soll gelöst werden?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Vorgeschlagene Lösung
      description: Beschreibe die gewünschte Änderung möglichst konkret.
    validations:
      required: true

  - type: textarea
    id: upstream
    attributes:
      label: Bezug zum Originalprojekt
      description: Falls das Original diese Funktion bereits besitzt, bitte auf die entsprechende Stelle verweisen.
    validations:
      required: false
