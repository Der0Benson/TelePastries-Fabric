name: Fabric-Build

on:
  push:
    branches: ["fabric-1.21.1"]
  pull_request:
    branches: ["fabric-1.21.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Mit Java 21 bauen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle-Wrapper ausführbar machen
        run: chmod +x ./gradlew

      - name: Fabric-Mod bauen
        run: ./gradlew --no-daemon build

      - name: JARs als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: TelePastries-Fabric-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
